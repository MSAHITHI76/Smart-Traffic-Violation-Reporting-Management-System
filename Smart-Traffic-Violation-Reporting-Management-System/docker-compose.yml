version: "3.8"

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: traffic_violation_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: traffic_violation_db
      MYSQL_USER: traffic_user
      MYSQL_PASSWORD: traffic_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Flask REST API Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic_violation_backend
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: traffic_user
      DB_PASSWORD: traffic_password
      DB_NAME: traffic_violation_db
      JWT_SECRET_KEY: traffic-violation-secret-key-prod-2025
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy

  # React Frontend Service
  frontend:
    image: node:20-alpine
    container_name: traffic_violation_frontend
    restart: always
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:5000
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
